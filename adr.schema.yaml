# JSON Schema (YAML-encoded) for an Architecture Decision Record
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://decisions.dabase.com/adr.schema.yaml
title: Architecture Decision Record
type: object
additionalProperties: false
required: [date, title, summary, status, feedback, context, decision, consequences, compliance, notes]

# Identity is the canonical URL: <date>/<slug>. There is no separate number, and
# no slug field — the filename is the slug, checked by build.py against the same
# pattern the schema used to enforce. Name the decision, not the topic: verb-first,
# e.g. approve-llm-assistants, not ai-policy. See RULES.md.
properties:
  date:
    description: Decision date, first path segment of the canonical URL
    type: string
    pattern: '^\d{4}-\d{2}-\d{2}$'

  title:
    description: Short description stating the decision
    type: string
    maxLength: 100

  summary:
    description: >
      The decision in one plain sentence — the standfirst a reader sees before
      any prose. Not the rationale; what was decided and why it matters. Kept
      short; build.py warns past its budget. See RULES.md.
    type: string

  status:
    description: Proposed, Accepted or Superseded
    type: string
    enum: [Proposed, Accepted, Superseded]

  supersededBy:
    description: Canonical URL of the decision that replaced this one
    type: string
    pattern: '^https?://\S+$'

  feedback:
    description: >
      Where to send disagreement, correction or a question — an email address,
      or the URL of a channel that accepts replies. A record with no reply path
      is a broadcast, not a decision record.
    type: string
    pattern: '^([^@\s]+@[^@\s]+\.[^@\s]+|https?://\S+)$'

  context:
    description: What are the forces that lead to this decision?
    type: string

  decision:
    description: The decision and why was it taken?
    type: string

  consequences:
    description: What is the impact, both positive and negative?
    type: object
    additionalProperties: false
    required: [positive, negative]
    properties:
      positive:
        type: array
        minItems: 1
        items: {type: string}
      negative:
        type: array
        minItems: 1
        items: {type: string}

  compliance:
    description: How will it be measured and enforced?
    type: string

  notes:
    description: Metadata for the decision
    type: object
    required: [owner]
    properties:
      owner:
        description: Accountable person or team
        type: string
      deciders:
        type: array
        items: {type: string}
      reviewBy:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
      tags:
        type: array
        items: {type: string}

# Superseded records must say what replaced them
allOf:
  - if:
      properties: {status: {const: Superseded}}
      required: [status]
    then:
      required: [supersededBy]
